<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - Colegio Enrique Paillardelle</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/paginaweb.css">
    <link rel="icon" type="image/png" href="img/logo_enriquepaillardelle.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- Contenedor donde se cargará el encabezado dinámicamente -->
    <div id="header-container"></div>

    <main class="contenedor-login-seccion">
        <div class="login-wrapper">
            
            <h1 class="titulo-colegio">Colegio Enrique Paillardelle</h1>

            <div class="tarjeta-login">
                <h2>INICIO DE SESIÓN</h2>
                <p class="subtitulo">Accede a tu cuenta para continuar</p>

                <form id="loginForm">
                    
                    <div class="grupo-campo">
                        <label for="correo electrónico">Correo electrónico</label>
                        <input type="email" id="correo electrónico" name="email" placeholder="Ingresa tu correo electrónico" required>
                    </div>

                    <div class="grupo-campo">
                        <label for="pass">Contraseña</label>
                        <input type="password" id="pass" name="password" placeholder="Ingresa tu contraseña" required>
                    </div>

                    <a href="#" class="olvido-pass">¿Olvidaste tu contraseña?</a>

                    <button type="submit" class="btn-ingresar">Ingresar</button>
                </form>

                <a href="registro.html" class="registro-link">¿No tienes cuenta? <span>Registrate</span></a>
            </div>

        </div>
    </main>

    <footer id="footer-container"></footer>

    <!-- Cargamos primero el script que renderiza el Header -->
    <script src="script.js/header.js"></script>
    <script src="script.js/login.js"></script>
    <!-- SweetAlert2 CSS y JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script src="script.js/footer.js"></script>
</body>
</html>
