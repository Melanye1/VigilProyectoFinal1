<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noticias - Colegio Enrique Paillardelle</title>
  <link rel="stylesheet" href="css/paginaweb.css">
  <link rel="stylesheet" href="css/noticias.css">
  <link rel="icon" type="image/png" href="img/logo_enriquepaillardelle.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<body>

  <div id="header-container"></div>

  <main class="contenedor-modulo-noticias">

    <section class="encabezado-noticias-titulo text-center">
      <h2>ÚLTIMAS NOTICIAS</h2>
      <div class="linea-decorativa-amarilla-centrada"></div>
      <p>Mantente informado de nuestras actividades</p>
    </section>

    <section class="seccion-noticia-destacada" id="noticia-destacada-container">
      <p class="text-center">Cargando última noticia...</p>
    </section>

    <section class="seccion-noticias-recientes">
      <h3 class="titulo-recientes"><i class="bi bi-calendar"></i> NOTICIAS RECIENTES</h3>

      <div class="grid-noticias-recientes" id="noticias-recientes-container">
        <p>Cargando noticias recientes...</p>
      </div>
    </section>

    <div id="paginacion-container" class="contenedor-paginacion"></div>

  </main>

  <footer id="footer-container"></footer>
  <script src="script.js/header.js"></script>
  <script src="script.js/noticias.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bundle.min.js"></script>

  <script src="script.js/footer.js"></script>
</body>

</html>
